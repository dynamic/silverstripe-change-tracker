---
Name: datachange_injector_config
---
SilverStripe\Core\Injector\Injector:
  DataChangeTrackService:
    class: \Symbiote\DataChange\Service\DataChangeTrackService
  Symbiote\DataChange\Extension\ChangeRecordable:
    properties:
      dataChangeTrackService: "%$DataChangeTrackService"
  Symbiote\DataChange\Extension\SiteTreeChangeRecordable:
    properties:
      dataChangeTrackService: "%$DataChangeTrackService"
  # many_many add and remove calls are recorded for the join tables listed in trackedRelationships (none by default)
  SilverStripe\ORM\ManyManyList:
    class: Symbiote\DataChange\Model\TrackedManyManyList

Symbiote\DataChange\Model\DataChangeRecord:
  extensions:
    changeRecordExtension: Symbiote\DataChange\Extension\DataChangeRecordExtension
