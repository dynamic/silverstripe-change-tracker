---
Name: datachange_injector_config
---
SilverStripe\Core\Injector\Injector:
  DataChangeTrackService:
    class: \Dynamic\ChangeTracker\Service\DataChangeTrackService
  Dynamic\ChangeTracker\Extension\ChangeRecordable:
    properties:
      dataChangeTrackService: "%$DataChangeTrackService"
  Dynamic\ChangeTracker\Extension\SiteTreeChangeRecordable:
    properties:
      dataChangeTrackService: "%$DataChangeTrackService"
  # many_many add and remove calls are recorded for the join tables listed in trackedRelationships (none by default)
  SilverStripe\ORM\ManyManyList:
    class: Dynamic\ChangeTracker\ORM\TrackedManyManyList

Dynamic\ChangeTracker\Model\DataChangeRecord:
  extensions:
    changeRecordExtension: Dynamic\ChangeTracker\Extension\DataChangeRecordExtension
